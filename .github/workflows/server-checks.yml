name: Server checks and binaries

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Go tests and API smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Vet Go packages
        run: go vet ./...
      - name: Run tests with race detection
        run: go test -race ./...
      - name: Exercise a real server with fake ASR
        working-directory: .
        run: ./scripts/e2e-server.sh

  build:
    name: Linux ${{ matrix.arch }} binary
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build static binary and checksum
        env:
          SERVER_ARCH: ${{ matrix.arch }}
        run: ./tools/build-server.sh "$SERVER_ARCH"
      - name: Check AMD64 executable
        if: matrix.arch == 'amd64'
        run: ./build/server/linux-amd64/memo-server-linux-amd64 version
      - name: Upload server binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: memo-server-linux-${{ matrix.arch }}
          path: build/server/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 7
